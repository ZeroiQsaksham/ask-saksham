# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
# You will be asked for GROQ_API_KEY (kept secret, never stored in the repo).
services:
  - type: web
    name: ask-saksham
    runtime: python
    plan: free
    # Build both search indexes (incl. the 515-page book) at build time so startup is fast
    buildCommand: pip install -r requirements.txt && python -m app.ingest
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: AGENT_NAME
        value: Saksham
      - key: OWNER_NAME
        value: Saksham
      - key: TOP_K
        value: "6"
      - key: ASTRO_TOP_K
        value: "5"
